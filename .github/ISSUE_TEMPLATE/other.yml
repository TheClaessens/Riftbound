name: "Other"
description: "Questions, comments, accessibility, anything else"
title: "[Other] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Riftbound better. This report becomes a public issue.
  - type: textarea
    id: details
    attributes:
      label: "Details"
      description: "Tell us what is on your mind."
      placeholder: "I was wondering ..."
    validations:
      required: true
  - type: textarea
    id: run
    attributes:
      label: "Run details"
      description: "Filled in by the in-game Feedback button. Safe to edit or delete."
      render: text
    validations:
      required: false
