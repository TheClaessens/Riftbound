name: "Bug"
description: "Something in Riftbound is broken or behaves wrongly"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Riftbound better. This report becomes a public issue.
  - type: textarea
    id: details
    attributes:
      label: "Details"
      description: "What happened, what you expected, and the steps to make it happen again."
      placeholder: "Start a run as ..., then ..."
    validations:
      required: true
  - type: textarea
    id: run
    attributes:
      label: "Run details"
      description: "Filled in by the in-game Feedback button. Safe to edit or delete."
      render: text
    validations:
      required: false
