<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo Renderer</title>
  <!-- 1. Fonts used by the titles (and the game, if it renders text). -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- 2. Kit config + shims: MUST run before any game code. raf: 'manual' stops the game's own loop. -->
  <script>window.PROMO = { width: 1920, height: 1080, seed: 1, raf: 'manual', timers: 'real' };</script>
  <script src="kit/shims.js"></script>
  <!-- 3. Whatever the game's own index.html needs before its modules (import maps, CSS, globals). -->
  <style>
    html, body { margin: 0; background: #08060d; color: #cfc6e8; font: 13px sans-serif; overflow: hidden; }
    /* Keep the game mounted (it must render) but out of sight; hide its DOM HUD. */
    #game-host { position: fixed; left: -5000px; top: 0; }
    #comp { position: fixed; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: #000; }
    #status { position: fixed; left: 8px; top: 6px; z-index: 5; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div id="game-host"><!-- the game's expected DOM (container ids, canvas…) --></div>
  <canvas id="comp" width="1920" height="1080"></canvas>
  <div id="status">loading…</div>
  <script type="module" src="promo.js"></script>
</body>
</html>
