<!doctype html>
<html><head><meta charset="utf-8"><title>Mini Arena</title>
<style>body{margin:0;background:#111;color:#eee;font:14px sans-serif}#hud{position:absolute;left:8px;top:8px}
#pick{display:none;position:absolute;left:250px;top:200px;background:#333;padding:12px}#pick button{display:block;margin-top:6px}</style></head>
<body><canvas id="c" width="800" height="600"></canvas><div id="ui"><div id="hud"></div><div id="pick"></div></div>
<script type="module">
import { Game } from './game.js';
const game = new Game(document.getElementById('c'));
window.game = game;
addEventListener('keydown', (e) => game.keys.add(e.key)); addEventListener('keyup', (e) => game.keys.delete(e.key));
const c = game.canvas;
c.addEventListener('mousemove', (e) => { game.mouse.x = e.offsetX; game.mouse.y = e.offsetY; });
c.addEventListener('mousedown', () => { game.mouse.down = true; }); addEventListener('mouseup', () => { game.mouse.down = false; });
let last = performance.now();
function loop(t) { game.update(Math.min(0.05, (t - last) / 1000)); last = t; game.render(); requestAnimationFrame(loop); }
game.start(); requestAnimationFrame(loop);
</script></body></html>
