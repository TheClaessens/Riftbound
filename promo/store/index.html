<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Assets</title>
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/style.css">
  <!-- Size comes from the URL (?w=1920&h=1080, ?w=1080&h=1920, ...): the shims pin it before any game module loads. -->
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const width = +q.get('w') || 1920, height = +q.get('h') || 1080;
      window.PROMO = { width, height, seed: 1, raf: 'manual', timers: 'virtual' };   // virtual: game setTimeouts (arena warm-up) land on the same frame every render
    })();
  </script>
  <script src="/__studio/kits/promo/shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "../../vendor/three/build/three.module.js",
      "three/addons/": "../../vendor/three/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; background: #08060d; color: #cfc6e8; font: 13px 'Alegreya Sans', sans-serif; overflow: hidden; }
    #game { position: fixed; left: -9000px; top: 0; }
    #fx-layer, #ui { display: none !important; }
    #comp { position: fixed; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; background: #000; }
    #status { position: fixed; left: 8px; top: 6px; z-index: 5; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="fx-layer"></div>
  <div id="ui"></div>
  <canvas id="comp"></canvas>
  <div id="status">loading…</div>
  <script type="module" src="store.js"></script>
</body>
</html>
