<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Icon Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Grenze:wght@600;700;800&family=Grenze+Gotisch:wght@700&family=Alegreya+Sans+SC:wght@700;800&family=Alegreya+Sans:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
  <style>
    html, body { margin: 0; background: var(--cf-plate-0); color: var(--cf-text); font: 14px var(--font-body); }
    body { padding: 12px; }
    h1 { font: 700 22px var(--font-head); margin: 0 0 8px; }
    .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--cf-dim); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 220px), 1fr)); gap: 8px; }
    .cell { border: 1px solid #332b44; padding: 6px; }
    .cell .id { font: 700 12px var(--font-label); color: var(--cf-dim); margin-bottom: 4px; letter-spacing: .04em; }
    .row { display: flex; align-items: flex-end; gap: 6px; padding: 4px; }
    .row.grass { background: #7bb147; } .row.barrens { background: #ce7122; } .row.water { background: #3a7fb0; } .row.plate { background: var(--cf-plate-1); }
    .missing { color: #ff8a6a; }
  </style>
</head>
<body>
  <h1>Crownforge icons</h1>
  <div class="bar"><span id="count"></span> · ?filter=skill- · ?sizes=24,32,48,96 · ?el=fire · ?cell=260</div>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { ensureIcons, iconIds, icon } from '../src/ui/icons/index.js';
    const q = new URLSearchParams(location.search);
    const filter = q.get('filter') || '';
    const sizes = (q.get('sizes') || '24,32,48,96').split(',').map(Number);
    const forceEl = q.get('el');
    if (q.get('cell')) document.documentElement.style.setProperty('--cell', q.get('cell') + 'px');
    const elOf = (id) => forceEl || ({ fireball: 'fire', frostNova: 'frost' })[id.split('-')[1]] || (window.__ELEM?.[id]) || '';
    ensureIcons();
    let elems = {};
    try {
      const { ALL_DEFS: SKILLS } = await import('../src/game/skills/registry.js');
      const { RELICS, RELIC_TAG_COLOR } = await import('../src/game/relics.js');
      for (const r of Object.values(RELICS)) window.__ACC = Object.assign(window.__ACC || {}, { ['relic-' + r.id]: RELIC_TAG_COLOR[r.tag] });
      for (const s of Object.values(SKILLS)) elems['skill-' + s.id] = s.element;
    } catch (e) { console.warn(e); }
    const ids = iconIds().filter((id) => id.includes(filter));
    document.getElementById('count').textContent = ids.length + ' icons';
    const grounds = (q.get('grounds') || 'plate,grass,barrens,water').split(',');
    document.getElementById('grid').innerHTML = ids.map((id) => {
      const el = forceEl || elems[id] || (id.startsWith('el-') ? id.slice(3) : '') || '';
      const rows = grounds.map((g) => `<div class="row ${g}">${sizes.map((s) => `<span style="font-size:${s}px">${icon(id, { el })}</span>`).join('')}</div>`).join('');
      const acc = window.__ACC?.[id];
      return `<div class="cell"${acc ? ` style="--acc:${acc}"` : ''}><div class="id">${id}${el ? ' · ' + el : ''}</div>${rows}</div>`;
    }).join('');
  </script>
</body>
</html>
