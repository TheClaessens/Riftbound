<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Creature Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #222; overflow: hidden; font: 12px Inter, sans-serif; color: #fff; }
    #game { position: fixed; inset: 0; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    #labels div { position: absolute; transform: translate(-50%, 0); text-shadow: 0 1px 2px #000; white-space: nowrap; }
    #info { position: fixed; left: 8px; top: 6px; text-shadow: 0 1px 2px #000; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="labels"></div>
  <div id="info"></div>
  <script type="module" src="../src/dev/viewer.js"></script>
</body>
</html>
